name: Send Reminders

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    # Only runs once the SITE_URL repository variable is set
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders
        run: |
          curl -X POST ${{ vars.SITE_URL }}dashboard/send-reminders/ \
          -H "X-SECRET-TOKEN: ${{ secrets.SECRET_TOKEN }}"
